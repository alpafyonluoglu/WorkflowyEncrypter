<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Decryption Helper Tool | Workflowy Encrypter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 40px 20px;
            color: #333333;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 22px 24px 20px 24px;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e5e5e5;
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 4px;
            font-size: 18px;
            font-weight: 600;
            color: #333333;
        }

        .subtitle {
            color: #777777;
            font-size: 13px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 4px;
            font-weight: 500;
            font-size: 12px;
            color: #777777;
        }

        input, textarea {
            width: 100%;
            padding: 7px 9px;
            font-size: 13px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #dddddd;
            font-family: monospace;
            background: #ffffff;
            color: #333333;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 1px #4a90e2;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        button {
            margin-top: 16px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            background-color: rgb(106, 184, 237);
            color: white;
            border: none;
            border-radius: 999px;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(86, 164, 217);
        }

        .output-container {
            margin-top: 22px;
        }

        .footer {
            margin-top: 18px;
            font-size: 11px;
            color: #999999;
        }

        .error {
            margin-top: 10px;
            color: #d93025;
            font-size: 12px;
            font-weight: 500;
        }

        .loading {
            margin-top: 10px;
            color: #777777;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Decryption Helper Tool</h1>

    <div class="subtitle">
        Use this tool to decrypt content generated by the Workflowy Encrypter extension.
    </div>

    <label for="password">Encryption Key</label>
    <input type="password" id="password" placeholder="Enter your encryption key">

    <label for="inputText">Encrypted Content</label>
    <textarea id="inputText" placeholder="Paste encrypted Workflowy content here"></textarea>

    <button onclick="decrypt()">Decrypt</button>
    <div id="error" class="error" style="display:none;"></div>

    <div class="output-container">
        <label for="output">Decrypted Content</label>
        <textarea id="output" readonly placeholder="Decrypted content will appear here"></textarea>
    </div>

    <div class="footer">
        Local helper tool for Workflowy Encrypter. Runs entirely in your browser.
    </div>

</div>

<script>
const PRE_ENC_CHAR = "_";

class Encrypter {
  enc;
  dec;

  constructor(password) {
    this.enc = new TextEncoder();
    this.dec = new TextDecoder();
  }

  async encrypt(data, SECRET) {
    if (!SECRET || SECRET === null | SECRET === "null" || SECRET === "") {
      return data;
    }
    const encryptedData = await this.encryptData(data, SECRET);
    return PRE_ENC_CHAR + encryptedData;
  }
  
  async decrypt(data, SECRET) {
    if (!data.startsWith(PRE_ENC_CHAR)) {
      return data;
    } else if (!SECRET || SECRET === null | SECRET === "null" || SECRET === "") {
      return data;
    }

    let origData = data;
    data = data.substring(PRE_ENC_CHAR.length);
    const decryptedData = await this.decryptData(data, SECRET);
    return decryptedData || data;
  }

  // Encryption helper functions [https://github.com/bradyjoslin/webcrypto-example]
  buff_to_base64 = (buff) => btoa(
    new Uint8Array(buff).reduce(
      (data, byte) => data + String.fromCharCode(byte), ''
    )
  );

  base64_to_buf = (b64) =>
    Uint8Array.from(atob(b64), (c) => c.charCodeAt(null));

  getPasswordKey = (password) =>
    window.crypto.subtle.importKey("raw", this.enc.encode(password), "PBKDF2", false, [
      "deriveKey",
    ]);

  deriveKey = (passwordKey, salt, keyUsage) =>
    window.crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: salt,
        iterations: 250000,
        hash: "SHA-256",
      },
      passwordKey,
      { name: "AES-GCM", length: 256 },
      false,
      keyUsage
    );

  async encryptData(secretData, password) {
    try {
      const salt = window.crypto.getRandomValues(new Uint8Array(16));
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const passwordKey = await this.getPasswordKey(password);
      const aesKey = await this.deriveKey(passwordKey, salt, ["encrypt"]);
      const encryptedContent = await window.crypto.subtle.encrypt(
        {
          name: "AES-GCM",
          iv: iv,
        },
        aesKey,
        this.enc.encode(secretData)
      );

      const encryptedContentArr = new Uint8Array(encryptedContent);
      let buff = new Uint8Array(
        salt.byteLength + iv.byteLength + encryptedContentArr.byteLength
      );
      buff.set(salt, 0);
      buff.set(iv, salt.byteLength);
      buff.set(encryptedContentArr, salt.byteLength + iv.byteLength);
      const base64Buff = this.buff_to_base64(buff);
      return base64Buff;
    } catch (e) {
      console.warn(`[Workflowy Encrypter] Encryption error`, e);
      return "";
    }
  }

  async decryptData(encryptedData, password) {
    try {
      const encryptedDataBuff = this.base64_to_buf(encryptedData);
      const salt = encryptedDataBuff.slice(0, 16);
      const iv = encryptedDataBuff.slice(16, 16 + 12);
      const data = encryptedDataBuff.slice(16 + 12);
      const passwordKey = await this.getPasswordKey(password);
      const aesKey = await this.deriveKey(passwordKey, salt, ["decrypt"]);
      const decryptedContent = await window.crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: iv,
        },
        aesKey,
        data
      );
      return this.dec.decode(decryptedContent);
    } catch (e) {
      console.warn(`[Workflowy Encrypter] Encryption error`, e);
      return "";
    }
  }
}
const encrypter = new Encrypter();

async function decrypt() {
    const password = document.getElementById("password").value;
    const inputText = document.getElementById("inputText").value;
    const errorDiv = document.getElementById("error");
    const button = document.querySelector("button");
    const originalButtonText = button.textContent;

    // Reset error state
    errorDiv.style.display = "none";
    errorDiv.textContent = "";

    // Validate password
    if (!password || password.trim() === "") {
        errorDiv.textContent = "Please enter your encryption key.";
        errorDiv.style.display = "block";
        return;
    }

    // Validate input text
    if (!inputText || inputText.trim() === "") {
        errorDiv.textContent = "Please paste encrypted content to decrypt.";
        errorDiv.style.display = "block";
        return;
    }

    // Show loading indicator on button
    button.disabled = true;
    button.style.opacity = "0.6";
    button.textContent = "Decrypting...";

    let inputLines = inputText.split('\n');
    let output = [];

    try {
        for (let line of inputLines) {
            let result = await encrypter.decrypt(line, password);
            output.push(result);
        }

        document.getElementById("output").value = output.join('\n');
    } catch (e) {
        errorDiv.textContent = "Decryption failed. Please check your password and input.";
        errorDiv.style.display = "block";
    } finally {
        button.disabled = false;
        button.style.opacity = "1";
        button.textContent = originalButtonText;
    }
}
</script>
</body>
</html>
